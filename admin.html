<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Orbit Cafe - الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="rings"></div>

<form id="login" class="login" hidden>
  <h2>دخول الإدارة</h2>
  <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
  <button>دخول</button>
  <p id="lerr" class="err"></p>
</form>

<div id="app" class="wrap" hidden>
  <div class="oh"><h2>Orbit Cafe</h2><button id="out">خروج</button></div>
  <div class="tabs">
    <button id="t1" class="on">الطلبات</button>
    <button id="t2">المنيو</button>
  </div>
  <div id="pOrders"><div id="list"></div></div>
  <div id="pMenu" hidden>
    <form id="addf" class="add">
      <input id="ac" list="dl" placeholder="القسم" required>
      <input id="an" placeholder="اسم الصنف" required>
      <input id="ap" type="number" min="0" placeholder="السعر" required>
      <button>إضافة</button>
    </form>
    <datalist id="dl"></datalist>
    <div id="mlist"></div>
  </div>
</div>

<div id="editm" class="sheet" hidden>
  <form id="ef" class="ef">
    <h2>تعديل الصنف</h2>
    <img id="ep" class="ep" alt="" hidden>
    <label class="fl">الصورة<input id="ei" type="file" accept="image/*"></label>
    <button type="button" id="erm" class="ghost" style="margin:0">إزالة الصورة</button>
    <label class="fl">الاسم<input id="en" required></label>
    <label class="fl">القسم<input id="ec" list="dl" required></label>
    <label class="fl">السعر<input id="epr" type="number" min="0" required></label>
    <button id="esave" class="main">حفظ</button>
    <button type="button" id="ecancel" class="ghost" style="margin:0">إلغاء</button>
    <p id="eerr" class="err"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="menu-seed.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ac,menu=[],chan;
document.addEventListener('click',()=>{try{ac=ac||new AudioContext();ac.resume()}catch(e){}});
function beep(){try{const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.4)}catch(e){}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),1400)}

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  $('login').hidden=!!session;$('app').hidden=!session;
  if(session){loadOrders();loadMenu();listen()}
}
$('login').onsubmit=async e=>{
  e.preventDefault();$('lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error){$('lerr').textContent='البريد أو كلمة المرور غير صحيحة.';return}
  start();
};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
function tab(n){$('pOrders').hidden=n!==1;$('pMenu').hidden=n!==2;$('t1').className=n===1?'on':'';$('t2').className=n===2?'on':''}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

/* الطلبات */
async function loadOrders(){
  const {data}=await sb.from('orders').select('*').in('status',['new','preparing']).order('created_at');
  $('list').innerHTML=data&&data.length?data.map(o=>`<div class="ord ${o.status}">
    <div class="oh"><b>ترابيزة ${esc(o.table_no)}</b><span>${new Date(o.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div>
    <ul>${o.items.map(x=>`<li style="direction:ltr;text-align:left">${x.qty} × ${esc(x.name)}</li>`).join('')}</ul>
    <div class="oh"><b>${o.total} ج.م</b>${o.status==='new'?`<button onclick="st(${o.id},'preparing')">بدأ التحضير</button>`:`<button onclick="st(${o.id},'done')">تم التسليم</button>`}</div></div>`).join(''):'<p class="msg">لا توجد طلبات حالياً.</p>';
}
async function st(id,s){await sb.from('orders').update({status:s}).eq('id',id);loadOrders()}
function listen(){
  if(chan)return;
  chan=sb.channel('orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},p=>{if(p.eventType==='INSERT')beep();loadOrders()}).subscribe();
}

/* المنيو */
async function loadMenu(){
  const {data}=await sb.from('menu_items').select('*').order('sort');
  menu=data||[];
  if(!menu.length){$('mlist').innerHTML='<p class="msg">المنيو فارغ.</p><button class="main" style="width:100%" onclick="seed()">استيراد المنيو الأساسي</button>';return}
  const cats=[...new Set(menu.map(i=>i.category))];
  $('dl').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  $('mlist').innerHTML=cats.map(c=>`<h3>${esc(c)}</h3>`+menu.filter(i=>i.category===c).map(i=>`<div class="mr">
    ${i.image_url?`<img class="th" src="${esc(i.image_url)}" alt="">`:'<div class="th">🖼</div>'}
    <div class="mi"><b>${esc(i.name)}</b><span>${i.price} ج.م</span></div>
    <label><input type="checkbox" ${i.available?'checked':''} onchange="up(${i.id},{available:this.checked})"> متاح</label>
    <button onclick="edit(${i.id})">تعديل</button>
    <button class="dl" onclick="del(${i.id})">حذف</button></div>`).join('')).join('');
}
async function up(id,p){const {error}=await sb.from('menu_items').update(p).eq('id',id);toast(error?'لم يُحفظ، حاول مرة أخرى':'تم الحفظ')}
async function del(id){if(!confirm('حذف الصنف؟'))return;await sb.from('menu_items').delete().eq('id',id);loadMenu()}
$('addf').onsubmit=async e=>{
  e.preventDefault();
  const sort=menu.reduce((m,i)=>Math.max(m,i.sort),0)+1;
  const {error}=await sb.from('menu_items').insert({category:$('ac').value.trim(),name:$('an').value.trim(),price:+$('ap').value,sort});
  if(error){toast('لم تتم الإضافة');return}
  $('an').value='';$('ap').value='';toast('تمت الإضافة');loadMenu();
};
async function seed(){
  let n=0;const rows=[];
  SEED.forEach(([category,list])=>list.forEach(([name,price])=>rows.push({category,name,price,sort:++n})));
  const {error}=await sb.from('menu_items').insert(rows);
  toast(error?'فشل الاستيراد':'تم استيراد المنيو');loadMenu();
}
/* تعديل صنف + صورة */
let cur=null,file=null,rm=false;
function showPrev(u){$('ep').hidden=!u;if(u)$('ep').src=u}
function edit(id){
  cur=menu.find(i=>i.id===id);file=null;rm=false;
  $('en').value=cur.name;$('ec').value=cur.category;$('epr').value=cur.price;$('ei').value='';
  showPrev(cur.image_url);$('eerr').textContent='';$('editm').hidden=false;
}
$('ei').onchange=e=>{file=e.target.files[0]||null;rm=false;if(file)showPrev(URL.createObjectURL(file))};
$('erm').onclick=()=>{file=null;rm=true;$('ei').value='';showPrev('')};
$('ecancel').onclick=()=>{$('editm').hidden=true};
function shrink(f){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const r=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};
  im.onerror=no;im.src=u})}
function oldPath(u){const m=u&&u.split('/menu-images/')[1];return m||null}
$('ef').onsubmit=async e=>{
  e.preventDefault();$('esave').disabled=true;$('eerr').textContent='';
  try{
    const p={name:$('en').value.trim(),category:$('ec').value.trim(),price:+$('epr').value};
    if(file){
      const b=await shrink(file),path=cur.id+'-'+Date.now()+'.jpg';
      const {error:ue}=await sb.storage.from('menu-images').upload(path,b,{contentType:'image/jpeg'});
      if(ue)throw ue;
      p.image_url=sb.storage.from('menu-images').getPublicUrl(path).data.publicUrl;
    }else if(rm)p.image_url=null;
    const {error}=await sb.from('menu_items').update(p).eq('id',cur.id);
    if(error)throw error;
    if((file||rm)&&oldPath(cur.image_url))sb.storage.from('menu-images').remove([oldPath(cur.image_url)]);
    $('editm').hidden=true;toast('تم الحفظ');loadMenu();
  }catch(x){$('eerr').textContent='لم يُحفظ. تأكد من تنفيذ ملف storage.sql ثم حاول مرة أخرى.'}
  $('esave').disabled=false;
};

start();
</script>
</body>
</html>
