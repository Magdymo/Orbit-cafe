<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Orbit Cafe - الإدارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="rings"></div>

<form id="login" class="login" hidden>
  <h2>دخول الإدارة</h2>
  <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="username" required>
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required>
  <button>دخول</button>
  <p id="lerr" class="err"></p>
</form>

<div id="app" class="wrap" hidden>
  <div class="oh"><h2>Orbit Cafe</h2><button id="out">خروج</button></div>
  <p id="who" class="hint"></p>
  <div class="tabs">
    <button id="t1" class="on">الطلبات</button>
    <button id="t2" hidden>المنيو</button>
    <button id="t3" hidden>الفريق</button>
    <button id="t4" hidden>الإعدادات</button>
  </div>
  <div id="pOrders"><div id="list"></div><h3 id="doneh" hidden>تم التسليم اليوم</h3><div id="dlist"></div></div>
  <div id="pMenu" hidden>
    <form id="addf" class="add">
      <input id="ac" list="dl" placeholder="القسم" required>
      <input id="an" placeholder="اسم الصنف" required>
      <input id="ap" type="number" min="0" placeholder="السعر" required>
      <button>إضافة</button>
    </form>
    <datalist id="dl"></datalist>
    <div id="mlist"></div>
  </div>
  <div id="pTeam" hidden>
    <p class="hint">أضف الموظف باسمه وبريده وكلمة مرور تحددها، ثم أعطه البريد وكلمة المرور ليدخل بها من صفحة الإدارة.</p>
    <form id="tf" class="add" style="grid-template-columns:1fr 1fr">
      <input id="tn" placeholder="اسم الموظف" required>
      <input id="te" type="email" placeholder="بريد الموظف" required autocapitalize="off" style="direction:ltr">
      <input id="tp" type="text" placeholder="كلمة مرور (6 أحرف على الأقل)" minlength="6" required autocapitalize="off" style="grid-column:1/-1;direction:ltr">
      <select id="tr"><option value="staff">موظف (الطلبات فقط)</option><option value="cashier">كاشير (الطلبات + الفواتير)</option><option value="owner">مدير (كل الصلاحيات)</option></select>
      <button>إضافة موظف</button>
    </form>
    <div id="tlist"></div>
  </div>
  <div id="pSet" hidden>
    <form id="sf" class="ef" style="margin-top:10px">
      <p class="hint">الضريبة تظهر للعميل في مراجعة الطلب وتُضاف على كل طلب جديد. تعديلها أو حذفها لا يغيّر الطلبات السابقة.</p>
      <label class="fl">اسم الضريبة<input id="sn" placeholder="مثال: ضريبة القيمة المضافة" required></label>
      <label class="fl">النسبة %<input id="sr" type="number" min="0" max="100" step="0.01" required></label>
      <label class="fl" style="display:flex;gap:8px;align-items:center"><input id="se" type="checkbox" style="width:auto"> تفعيل الضريبة</label>
      <button class="main" id="ssave">حفظ</button>
      <button type="button" id="sdel" class="ghost" style="margin:0;color:#b3261e">حذف الضريبة</button>
    </form>
  </div>
</div>

<div id="inv"></div>

<div id="editm" class="sheet" hidden>
  <form id="ef" class="ef">
    <h2>تعديل الصنف</h2>
    <img id="ep" class="ep" alt="" hidden>
    <label class="fl">الصورة<input id="ei" type="file" accept="image/*"></label>
    <button type="button" id="erm" class="ghost" style="margin:0">إزالة الصورة</button>
    <label class="fl">الاسم<input id="en" required></label>
    <label class="fl">القسم<input id="ec" list="dl" required></label>
    <label class="fl">السعر<input id="epr" type="number" min="0" required></label>
    <button id="esave" class="main">حفظ</button>
    <button type="button" id="ecancel" class="ghost" style="margin:0">إلغاء</button>
    <p id="eerr" class="err"></p>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="menu-seed.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ac,menu=[],chan,me=null,team=[],orders=[];
const RL={owner:'مدير',cashier:'كاشير',staff:'موظف'};
const CAFE='Orbit Cafe';
const money=n=>(+n).toFixed(2).replace(/\.00$/,'');
document.addEventListener('click',()=>{try{ac=ac||new AudioContext();ac.resume()}catch(e){}});
function beep(){try{const o=ac.createOscillator();o.connect(ac.destination);o.frequency.value=880;o.start();o.stop(ac.currentTime+.4)}catch(e){}}
function toast(t,bad){const d=document.createElement('div');d.className='toast';if(bad)d.style.background='#b3261e';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),bad?4000:1400)}

async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').hidden=false;$('app').hidden=true;return}
  const {data:row,error:se}=await sb.from('staff').select('*').eq('email',session.user.email.toLowerCase()).maybeSingle();
  if(se||!row){
    await sb.auth.signOut();$('login').hidden=false;$('app').hidden=true;
    $('lerr').textContent=se?'تعذر التحقق من الصلاحيات. تأكد من تنفيذ team.sql.':'هذا الحساب غير مضاف إلى فريق العمل.';
    return;
  }
  me=row;$('login').hidden=true;$('app').hidden=false;
  const own=me.role==='owner';
  $('who').textContent='أهلاً '+me.name+' · '+(RL[me.role]||me.role);
  $('t2').hidden=!own;$('t3').hidden=!own;$('t4').hidden=!own;
  loadOrders();listen();
  if(own){loadMenu();loadTeam();loadSettings()}
}
$('login').onsubmit=async e=>{
  e.preventDefault();$('lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});
  if(error){$('lerr').textContent='البريد أو كلمة المرور غير صحيحة.';return}
  start();
};
$('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
function tab(n){
  $('pOrders').hidden=n!==1;$('pMenu').hidden=n!==2;$('pTeam').hidden=n!==3;$('pSet').hidden=n!==4;
  ['t1','t2','t3','t4'].forEach((id,k)=>$(id).className=n===k+1?'on':'');
}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);$('t3').onclick=()=>tab(3);$('t4').onclick=()=>tab(4);

/* الطلبات */
function card(o){
  const pr=me.role!=='staff'?`<button onclick="printInv(${o.id})">طباعة فاتورة</button>`:'';
  const act=o.status==='new'?`<button onclick="st(${o.id},'preparing')">بدأ التحضير</button>`:o.status==='preparing'?`<button onclick="st(${o.id},'done')">تم التسليم</button>`:'';
  return `<div class="ord ${o.status}">
    <div class="oh"><b>ترابيزة ${esc(o.table_no)}</b><span>${new Date(o.created_at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div>
    <ul>${o.items.map(x=>`<li style="direction:ltr;text-align:left">${x.qty} × ${esc(x.name)}</li>`).join('')}</ul>${o.handled_by?`<small>بواسطة: ${esc(o.handled_by)}</small>`:''}
    ${+o.tax_amount>0?`<small>المجموع ${money(o.subtotal)} + ${esc(o.tax_name||'ضريبة')} ${money(o.tax_rate)}% = ${money(o.tax_amount)} ج.م</small>`:''}
    <div class="oh"><b>${money(o.total)} ج.م</b><span class="bt">${pr}${act}</span></div></div>`;
}
async function loadOrders(){
  const d0=new Date();d0.setHours(0,0,0,0);
  const [a,b]=await Promise.all([
    sb.from('orders').select('*').in('status',['new','preparing']).order('created_at'),
    sb.from('orders').select('*').eq('status','done').gte('created_at',d0.toISOString()).order('created_at',{ascending:false}).limit(50)
  ]);
  const cur=a.data||[],dn=b.data||[];orders=[...cur,...dn];
  $('list').innerHTML=cur.length?cur.map(card).join(''):'<p class="msg">لا توجد طلبات حالياً.</p>';
  $('doneh').hidden=!dn.length;$('dlist').innerHTML=dn.map(card).join('');
}
function printInv(id){
  const o=orders.find(x=>x.id===id);if(!o)return;
  const sub=o.subtotal!=null?+o.subtotal:o.items.reduce((t,x)=>t+x.qty*x.price,0),tax=+o.tax_amount||0,d=new Date(o.created_at);
  $('inv').innerHTML=`<div class="iv"><h2>${esc(CAFE)}</h2><p>فاتورة رقم ${o.id}</p>
    <p>${d.toLocaleDateString('ar-EG')} ${d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</p><p>ترابيزة ${esc(o.table_no)}</p><hr>
    <table>${o.items.map(x=>`<tr><td class="n">${esc(x.name)}</td><td>${x.qty}×${money(x.price)}</td><td class="r">${money(x.qty*x.price)}</td></tr>`).join('')}</table><hr>
    <div class="ln"><span>المجموع</span><span>${money(sub)}</span></div>
    ${tax>0?`<div class="ln"><span>${esc(o.tax_name||'ضريبة')} (${money(o.tax_rate)}%)</span><span>${money(tax)}</span></div>`:''}
    <div class="ln tt"><span>الإجمالي</span><span>${money(o.total)} ج.م</span></div><hr><p>شكراً لزيارتكم</p></div>`;
  window.print();
}
async function st(id,s){await sb.from('orders').update({status:s,handled_by:me.name}).eq('id',id);loadOrders()}
function listen(){
  if(chan)return;
  chan=sb.channel('orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},p=>{if(p.eventType==='INSERT')beep();loadOrders()}).subscribe();
}

/* المنيو */
async function loadMenu(){
  const {data}=await sb.from('menu_items').select('*').order('sort');
  menu=data||[];
  if(!menu.length){$('mlist').innerHTML='<p class="msg">المنيو فارغ.</p><button class="main" style="width:100%" onclick="seed()">استيراد المنيو الأساسي</button>';return}
  const cats=[...new Set(menu.map(i=>i.category))];
  $('dl').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  $('mlist').innerHTML=cats.map(c=>`<h3>${esc(c)}</h3>`+menu.filter(i=>i.category===c).map(i=>`<div class="mr">
    ${i.image_url?`<img class="th" src="${esc(i.image_url)}" alt="">`:'<div class="th">🖼</div>'}
    <div class="mi"><b>${esc(i.name)}</b><span>${i.price} ج.م</span></div>
    <label><input type="checkbox" ${i.available?'checked':''} onchange="up(${i.id},{available:this.checked})"> متاح</label>
    <button onclick="edit(${i.id})">تعديل</button>
    <button class="dl" onclick="del(${i.id})">حذف</button></div>`).join('')).join('');
}
async function up(id,p){const {error}=await sb.from('menu_items').update(p).eq('id',id);toast(error?'لم يُحفظ، حاول مرة أخرى':'تم الحفظ')}
async function del(id){if(!confirm('حذف الصنف؟'))return;await sb.from('menu_items').delete().eq('id',id);loadMenu()}
$('addf').onsubmit=async e=>{
  e.preventDefault();
  const sort=menu.reduce((m,i)=>Math.max(m,i.sort),0)+1;
  const {error}=await sb.from('menu_items').insert({category:$('ac').value.trim(),name:$('an').value.trim(),price:+$('ap').value,sort});
  if(error){toast('لم تتم الإضافة');return}
  $('an').value='';$('ap').value='';toast('تمت الإضافة');loadMenu();
};
async function seed(){
  let n=0;const rows=[];
  SEED.forEach(([category,list])=>list.forEach(([name,price])=>rows.push({category,name,price,sort:++n})));
  const {error}=await sb.from('menu_items').insert(rows);
  toast(error?'فشل الاستيراد':'تم استيراد المنيو');loadMenu();
}
/* تعديل صنف + صورة */
let cur=null,file=null,rm=false;
function showPrev(u){$('ep').hidden=!u;if(u)$('ep').src=u}
function edit(id){
  cur=menu.find(i=>i.id===id);file=null;rm=false;
  $('en').value=cur.name;$('ec').value=cur.category;$('epr').value=cur.price;$('ei').value='';
  showPrev(cur.image_url);$('eerr').textContent='';$('editm').hidden=false;
}
$('ei').onchange=e=>{file=e.target.files[0]||null;rm=false;if(file)showPrev(URL.createObjectURL(file))};
$('erm').onclick=()=>{file=null;rm=true;$('ei').value='';showPrev('')};
$('ecancel').onclick=()=>{$('editm').hidden=true};
function shrink(f){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const r=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};
  im.onerror=no;im.src=u})}
function oldPath(u){const m=u&&u.split('/menu-images/')[1];return m||null}
$('ef').onsubmit=async e=>{
  e.preventDefault();$('esave').disabled=true;$('eerr').textContent='';
  try{
    const p={name:$('en').value.trim(),category:$('ec').value.trim(),price:+$('epr').value};
    if(file){
      const b=await shrink(file),path=cur.id+'-'+Date.now()+'.jpg';
      const {error:ue}=await sb.storage.from('menu-images').upload(path,b,{contentType:'image/jpeg'});
      if(ue)throw ue;
      p.image_url=sb.storage.from('menu-images').getPublicUrl(path).data.publicUrl;
    }else if(rm)p.image_url=null;
    const {error}=await sb.from('menu_items').update(p).eq('id',cur.id);
    if(error)throw error;
    if((file||rm)&&oldPath(cur.image_url))sb.storage.from('menu-images').remove([oldPath(cur.image_url)]);
    $('editm').hidden=true;toast('تم الحفظ');loadMenu();
  }catch(x){$('eerr').textContent='لم يُحفظ. تأكد من تنفيذ ملف storage.sql ثم حاول مرة أخرى.'}
  $('esave').disabled=false;
};

/* الفريق */
async function loadTeam(){
  const {data}=await sb.from('staff').select('*').order('created_at');
  team=data||[];
  $('tlist').innerHTML=team.map((m,i)=>`<div class="mr"><div class="mi" style="direction:rtl;text-align:right"><b>${esc(m.name)}</b><span style="direction:ltr;text-align:right">${esc(m.email)} · ${RL[m.role]||m.role}</span></div>${m.email===me.email?'':`<button class="dl" onclick="rmStaff(${i})">إيقاف</button>`}</div>`).join('');
}
$('tf').onsubmit=async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');btn.disabled=true;
  const name=$('tn').value.trim(),email=$('te').value.trim().toLowerCase(),password=$('tp').value,role=$('tr').value;
  try{
    // اتصال مؤقت لإنشاء الحساب دون التأثير على جلسة المدير
    const tmp=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    const {data,error}=await tmp.auth.signUp({email,password});
    let existed=false,noSession=false;
    if(error){
      if(/already|registered/i.test(error.message))existed=true;
      else if(/signups? (are )?(not allowed|disabled)/i.test(error.message)){toast('التسجيل مقفل في Supabase. فعّل Allow new users to sign up.',1);return}
      else{toast('تعذر إنشاء الحساب: '+error.message,1);return}
    }else if(data.user&&data.user.identities&&data.user.identities.length===0)existed=true;
    else if(!data.session)noSession=true;
    const {error:e2}=await sb.from('staff').insert({name,email,role});
    if(e2){toast(e2.code==='23505'?'هذا البريد مضاف بالفعل في الفريق.':'تعذر إضافة الموظف: '+e2.message,1);return}
    $('tf').reset();loadTeam();
    if(noSession)toast('تمت الإضافة، لكن «Confirm email» مفعّل في Supabase فلن يدخل الموظف قبل تأكيد بريده. أوقفه من الإعدادات.',1);
    else if(existed)toast('تمت إعادة تفعيل الموظف. كلمة مروره القديمة كما هي.');
    else toast('تمت إضافة الموظف');
  }finally{btn.disabled=false}
};
async function rmStaff(i){
  const m=team[i];if(!m||!confirm('إيقاف '+m.name+'؟ لن يستطيع رؤية الطلبات.'))return;
  const {error}=await sb.from('staff').delete().eq('email',m.email);
  if(error)toast('تعذر الإيقاف: '+error.message,1);else toast('تم الإيقاف');
  loadTeam();
}

/* الإعدادات: الضريبة */
async function loadSettings(){
  const {data}=await sb.from('settings').select('*').eq('id',1).maybeSingle();
  $('sn').value=(data&&data.tax_name)||'';$('sr').value=data?data.tax_rate:0;$('se').checked=!!(data&&data.tax_enabled);
}
$('sf').onsubmit=async e=>{
  e.preventDefault();
  const {error}=await sb.from('settings').update({tax_name:$('sn').value.trim(),tax_rate:+$('sr').value,tax_enabled:$('se').checked}).eq('id',1);
  toast(error?'لم يُحفظ. تأكد من تنفيذ tax.sql':'تم الحفظ');
};
$('sdel').onclick=async()=>{
  if(!confirm('حذف الضريبة؟ لن تُضاف على الطلبات الجديدة.'))return;
  const {error}=await sb.from('settings').update({tax_name:'ضريبة',tax_rate:0,tax_enabled:false}).eq('id',1);
  toast(error?'لم يتم الحذف':'تم حذف الضريبة');loadSettings();
};

start();
</script>
</body>
</html>
